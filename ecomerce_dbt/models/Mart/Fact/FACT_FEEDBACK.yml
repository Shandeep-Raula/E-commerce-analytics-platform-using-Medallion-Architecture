version: 2

models:
  - name: FACT_FEEDBACK
    description: "Fact table capturing customer and seller feedback, ratings, and sentiment analysis for orders"

    columns:

      - name: order_line_id
        description: "Unique identifier for each order line"
        tests:
          - not_null
          - relationships:
              to: ref('FACT_SALES')
              field: order_line_id

      - name: seller_rating
        description: "Rating given to the seller by the customer"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5

      - name: customer_rating
        description: "Overall customer rating for the order"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5

      - name: review_text
        description: "Customer review text for the order"

      - name: sentiment_score
        description: "Sentiment score derived from review text (typically -1 to 1)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -1
                max_value: 1