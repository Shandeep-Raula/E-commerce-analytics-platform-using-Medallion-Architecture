version: 2

sources:
  - name: ecommerce_landing
    description: "Raw landing layer containing unprocessed e-commerce data ingested from source systems"
    database: ECOMMERCE
    schema: LANDING

    tables:

      - name: raw_customers
        description: "Contains raw customer data including personal details and registration info"

      - name: raw_delivery_persons
        description: "Stores delivery personnel information such as contact details and assigned city"

      - name: raw_products
        description: "Raw product catalog including product names, categories, pricing"

      - name: raw_sellers
        description: "Seller information including seller profiles and ratings"

      - name: raw_sessions
        description: "Tracks user session activity including timestamps and interactions"

      - name: raw_channel
        description: "Channel source of traffic (Organic, Paid, Direct, etc.)"

      - name: raw_fulfillment
        description: "Order fulfillment details including shipping and delivery status"

      - name: raw_location
        description: "Geographical data such as city, state, and country"

      - name: raw_payment
        description: "Payment transaction details including payment method and status"

      - name: raw_order
        description: "Order details including order ID, customer ID, product ID, quantity, and total amount"

      - name: raw_marketing
        description: "Marketing campaign data including campaign name, channel, and performance metrics"